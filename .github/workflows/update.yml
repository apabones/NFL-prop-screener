{"name": "Update NFL data", "on": {"push": {"paths": ["fetch_nfl.py", ".github/workflows/update.yml"]}, "schedule": [{"cron": "0 3 * * 3"}, {"cron": "0 15 * * 3"}, {"cron": "0 15 * * 4"}, {"cron": "0 16 * * 6"}, {"cron": "0 15 * * 0"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"update": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"name": "Install PropLine", "run": "pip install propline"}, {"name": "Fetch NFL data and prop prices", "env": {"PROPLINE_KEY": "${{ secrets.PROPLINE_KEY }}"}, "run": "python fetch_nfl.py"}, {"name": "Save data", "run": "git config user.name github-actions && git config user.email github-actions@users.noreply.github.com && git add data && (git diff --cached --quiet || git commit -m 'Update NFL data') && git push"}], "timeout-minutes": 20}}}
