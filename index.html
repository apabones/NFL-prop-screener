<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Critter Board: College Hoops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe7d8;--surface:#fbf6ec;--ink:#221d16;--muted:#6f6556;--line:#dccfb8;--accent:#b4410e;--good:#15803d;--bad:#b91c1c;--warn:#a16207;--fav:#1d4ed8;--dog:#9a3412;
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--surface:#211d17;--ink:#f2ead9;--muted:#a89d8b;--line:#3b342a;--accent:#fb923c;--good:#4ade80;--bad:#f87171;--warn:#facc15;--fav:#60a5fa;--dog:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140f;--surface:#211d17;--ink:#f2ead9;--muted:#a89d8b;--line:#3b342a;--accent:#fb923c;--good:#4ade80;--bad:#f87171;--warn:#facc15;--fav:#60a5fa;--dog:#fb923c;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px 12px 40px}
h1{font:700 28px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:2px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font:600 14px Barlow,sans-serif;padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.game.faded{opacity:.72}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mu{font:700 18px/1.15 "Barlow Condensed",sans-serif}
.mu .fav{color:var(--fav)} .mu .dog{color:var(--muted);font-weight:600}
.tier{font:700 13px "Barlow Condensed",sans-serif;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--surface);white-space:nowrap}
.tier.early{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.lc{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.lc b{color:var(--ink)}
.flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.f{font:600 12px Barlow,sans-serif;padding:2px 8px;border-radius:999px}
.f.bet{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.f.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.f.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.f.info{background:color-mix(in srgb,var(--fav) 15%,transparent);color:var(--fav)}
details{margin-top:6px}
summary{font-size:13px;color:var(--accent);cursor:pointer}
.pill{display:grid;grid-template-columns:7.5em 1fr 1fr 2.6em;gap:6px;align-items:center;font-size:12.5px;margin-top:5px}
.gap{text-align:right;font-variant-numeric:tabular-nums}
.inj{font-size:12.5px;margin-top:6px;line-height:1.5}
.inj .tm{font-weight:700;margin-right:4px}
.inj .i{display:inline-block;margin:0 6px 2px 0;padding:1px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.inj .i.out{background:color-mix(in srgb,var(--bad) 16%,transparent);border-color:transparent;color:var(--bad);font-weight:600}
.inj .i.dbt{background:color-mix(in srgb,var(--warn) 18%,transparent);border-color:transparent;color:var(--warn);font-weight:600}
.inj .i.q{color:var(--muted)}
.inj .i.old{opacity:.6}
.inj .none{color:var(--muted)}
.pick{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:5px;font-size:12.5px}
.seg span{color:var(--muted);min-width:5.2em}
.seg button{font:600 13px Barlow,sans-serif;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.save{margin-top:7px;font:700 14px Barlow,sans-serif;padding:7px 14px;border-radius:9px;border:0;background:var(--accent);color:#fff}
.save:disabled{opacity:.45}
.mine{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.mine b{font:700 15px "Barlow Condensed",sans-serif}
.st{font:700 11px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.st.win{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-color:transparent}
.st.loss{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border-color:transparent}
.link{background:none;border:0;color:var(--accent);font:600 13px Barlow,sans-serif;padding:0;text-decoration:underline}
.setup input{width:100%;font:500 14px Barlow,sans-serif;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0}
.rec{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:13.5px;font-variant-numeric:tabular-nums;margin-top:4px}
.rec .h{color:var(--muted);font-size:12px}
.banner{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:12.5px;margin-bottom:8px}
.bar{position:relative;height:9px;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:5px}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.bar em{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.xp{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px}
.xp input{width:5.5em;font:500 15px Barlow,sans-serif;padding:5px 7px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.status{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}
.search{width:100%;font:500 16px Barlow,sans-serif;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:8px}
.legend{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.where{font:600 10.5px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:2px}
.duo{display:flex;align-items:center;gap:8px}
.ic{width:46px;height:50px;flex:none}
.ic svg{width:46px;height:50px;display:block;background:#f6efe2;border-radius:10px}
.sp{font:600 11px Barlow,sans-serif;color:var(--muted);text-align:center;margin-top:1px}
.day{font:700 16px "Barlow Condensed",sans-serif;margin:14px 0 6px;color:var(--accent)}
.prev{font:600 11px Barlow,sans-serif;color:var(--muted);border:1px dashed var(--muted);border-radius:999px;padding:1px 6px;margin-left:6px}
</style>
</head>
<body>
<main>
<h1>Critter Board</h1>
<p class="sub" id="sub">Loading…</p>
<div class="tabs" role="group" aria-label="View">
 <button data-v="up" aria-pressed="true">Upcoming</button>
 <button data-v="bet" aria-pressed="false">Bet Mode</button>
 <button data-v="line" aria-pressed="false">Lines</button>
 <button data-v="teams" aria-pressed="false">Teams</button>
 <button data-v="movers" aria-pressed="false">Movers</button>
 <button data-v="record" aria-pressed="false">Record</button>
</div>
<div id="view"></div>
<div class="status" id="status"></div>
</main>
<script>
/* ---------- critter drawings (shared with the Serengeti page) ---------- */
let preyCut = 1;
const lerp = (a, b, x) => a + (b - a) * Math.max(0, Math.min(1, x));
function hash(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
const PRED = ["Saber-tooth","Gorilla","Lion","Wolf","Weasel","Tiger","Jackal"];
function species(t){
  const pred = t.core >= 4 || t.net >= 0.85;
  if (pred){
    if (t.fang >= 0.9 && t.net >= 0.97 && t.core >= 5) return "Saber-tooth";
    if (t.ato >= 0.85 && t.efg >= 0.85 && t.net >= 0.85) return "Gorilla";
    if (t.reb >= 0.8 && t.paint >= 0.75) return "Lion";
    if (t.press >= 0.7 && t.fb >= 0.6) return "Wolf";
    if ((t.press >= 0.7 || t.stl >= 0.75) && t.reb < 0.6) return "Weasel";
    if (t.core >= 5) return "Tiger";
    return "Jackal";
  }
  if (t.prey >= preyCut) return t.ato < 0.4 ? "Rabbit" : "Goat";
  if (t.prey >= 0.6) return t.ato < 0.4 ? "Hare" : "Ram";
  return "Blob";
}
function predator(t, sp, flip){
  const cx = 150, cy = 172, id = "g" + Math.abs(t.n.split("").reduce((a, c) => a * 31 + c.charCodeAt(0) | 0, 7));
  const P = {"Saber-tooth":{W:96,R:86,chin:.95},"Gorilla":{W:104,R:84,chin:.55},"Lion":{W:90,R:84,chin:.85},"Wolf":{W:76,R:88,chin:1.0},
             "Weasel":{W:60,R:94,chin:1.05},"Tiger":{W:96,R:86,chin:.85},"Jackal":{W:72,R:84,chin:1.0}}[sp];
  const W = P.W, R = P.R;
  const base = shade(t.col, -0.12), deep = shade(t.col, -0.62), hi = shade(t.col, 0.25), ink = "#0b0a09";
  const face = sp === "Gorilla" ? shade(t.col, 0.45) : sp === "Lion" ? "#d9b26a" : shade(t.col, 0.38);
  const iris = {"Weasel":"#ef4444","Gorilla":"#f97316","Wolf":"#facc15","Jackal":"#facc15"}[sp] || "#fbbf24";
  let s = `<defs><radialGradient id="${id}h" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="${hi}"/><stop offset=".7" stop-color="${base}"/><stop offset="1" stop-color="${deep}"/></radialGradient>
    <filter id="${id}glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  // speed lines (fast break)
  if (t.fb > 0.55){ const k = Math.round((t.fb - 0.5) * 10); for (let i = 0; i < k; i++){ const y = cy - 46 + i * 20; s += `<path d="M${cx - W - 18 - (i % 2) * 8} ${y} h-${34 + (i * 7) % 20}" stroke="${deep}" stroke-width="4" stroke-linecap="round" opacity=".5"/>`; } }
  // lion mane (glass + paint)
  if (sp === "Lion"){ const n = 26, r1 = R * 1.18, r2 = R * (1.48 + 0.18 * t.reb); let d = "";
    for (let i = 0; i < n * 2; i++){ const a = i / (n * 2) * 2 * Math.PI - Math.PI / 2, r = i % 2 ? r1 : r2 * (0.92 + 0.08 * Math.sin(i * 1.7));
      d += (i ? "L" : "M") + (cx + Math.cos(a) * r * 1.02).toFixed(1) + " " + (cy + 6 + Math.sin(a) * r).toFixed(1); }
    s += `<path d="${d}Z" fill="${shade(t.col, -0.45)}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`; }
  // gorilla crest
  if (sp === "Gorilla") s += `<path d="M${cx - 40} ${cy - R + 14} Q ${cx} ${cy - R - 34} ${cx + 40} ${cy - R + 14} Z" fill="${deep}" stroke="${ink}" stroke-width="3"/>`;
  // ears
  const torn = t.ato < 0.4;
  [-1, 1].forEach(dd => {
    let e;
    if (sp === "Wolf" || sp === "Jackal"){ const bx = cx + dd * W * 0.55, by = cy - R * 0.62; e = `<path d="M${bx - dd * 4} ${by + 20} L${bx + dd * 30} ${by - 58} L${bx + dd * 40} ${by + 14} Z" fill="${base}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><path d="M${bx + dd * 10} ${by + 10} L${bx + dd * 29} ${by - 38} L${bx + dd * 32} ${by + 8} Z" fill="${deep}"/>`; }
    else if (sp === "Weasel"){ e = `<circle cx="${cx + dd * W * 0.8}" cy="${cy - R * 0.62}" r="14" fill="${base}" stroke="${ink}" stroke-width="3"/><circle cx="${cx + dd * W * 0.8}" cy="${cy - R * 0.62}" r="7" fill="${deep}"/>`; }
    else if (sp === "Gorilla"){ e = `<ellipse cx="${cx + dd * (W + 4)}" cy="${cy - 6}" rx="12" ry="18" fill="${base}" stroke="${ink}" stroke-width="3"/>`; }
    else { const bx = cx + dd * W * 0.66, by = cy - R * 0.72; e = `<path d="M${bx - dd * 26} ${by + 22} L ${bx + dd * 10} ${by - 52} L ${bx + dd * 34} ${by + 14} Z" fill="${base}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><path d="M${bx - dd * 10} ${by + 12} L ${bx + dd * 10} ${by - 32} L ${bx + dd * 22} ${by + 10} Z" fill="${deep}"/>`; }
    if (torn && sp !== "Gorilla") e += `<path d="M${cx + dd * W * 0.7} ${cy - R * 0.98} l${dd * 8} 10 l${dd * -10} 6" fill="#f6efe2" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s += e;
  });
  // head: angular shield with V chin
  const top = cy - R * 0.98, tY = cy - R * 0.5, ckY = cy + R * 0.08, jY = cy + R * 0.66, ch = cy + R * P.chin;
  s += `<path d="M${cx} ${top} C ${cx + W * 0.55} ${top} ${cx + W * 0.9} ${tY - 18} ${cx + W * 0.92} ${tY} L ${cx + W} ${ckY} L ${cx + W * 0.66} ${jY} Q ${cx + W * 0.3} ${ch} ${cx} ${ch} Q ${cx - W * 0.3} ${ch} ${cx - W * 0.66} ${jY} L ${cx - W} ${ckY} L ${cx - W * 0.92} ${tY} C ${cx - W * 0.9} ${tY - 18} ${cx - W * 0.55} ${top} ${cx} ${top} Z" fill="url(#${id}h)" stroke="${ink}" stroke-width="4" stroke-linejoin="round"/>`;
  // cheek fur (ORBTV)
  if (t.orbtv > 0.55 && sp !== "Gorilla"){ const k = 2 + Math.round((t.orbtv - 0.55) * 8);
    [-1, 1].forEach(dd => { for (let i = 0; i < k; i++){ const y = ckY - 4 + i * 12, x = cx + dd * (W - 6 - i * 5); s += `<path d="M${x} ${y - 8} L${x + dd * 18} ${y + 2} L${x - dd * 2} ${y + 6}" fill="${base}" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>`; } }); }
  // stripes (apex traits) for cats
  if (sp === "Tiger" || sp === "Saber-tooth"){ const k = Math.max(2, t.core);
    for (let i = 0; i < k; i++){ const dd = i % 2 ? 1 : -1, row = Math.floor(i / 2);
      s += `<path d="M${cx + dd * (W - 4)} ${tY + 14 + row * 20} l${-dd * 28} ${6} l${dd * 10} ${8} l${-dd * 22} ${4}" fill="none" stroke="${ink}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>`; }
    s += `<path d="M${cx} ${top + 6} l-9 22 l9 -6 l9 6 Z" fill="${ink}" opacity=".85"/><path d="M${cx - 22} ${top + 14} l6 22 M${cx + 22} ${top + 14} l-6 22" stroke="${ink}" stroke-width="5" stroke-linecap="round" opacity=".8"/>`; }
  // face mask / muzzle
  const mY = cy + R * 0.34, mW = sp === "Gorilla" ? W * 0.62 : sp === "Weasel" ? W * 0.5 : W * 0.56, mH = sp === "Wolf" || sp === "Weasel" || sp === "Jackal" ? R * 0.5 : R * 0.42;
  s += `<path d="M${cx - mW} ${mY - mH * 0.5} Q ${cx} ${mY - mH * 0.95} ${cx + mW} ${mY - mH * 0.5} Q ${cx + mW * 1.05} ${mY + mH * 0.7} ${cx} ${mY + mH} Q ${cx - mW * 1.05} ${mY + mH * 0.7} ${cx - mW} ${mY - mH * 0.5} Z" fill="${face}" stroke="${ink}" stroke-width="3"/>`;
  // eyes: angled, glowing, close-set (paint pulls closer)
  const ex = lerp(40, 26, t.paint) * (sp === "Gorilla" ? 1.15 : 1), ey = cy - R * 0.2;
  [-1, 1].forEach(dd => {
    const x = cx + dd * ex, ix = x - dd * 15, ox = x + dd * 17;
    if (sp === "Gorilla") s += `<ellipse cx="${x}" cy="${ey + 2}" rx="20" ry="14" fill="${ink}" opacity=".55"/>`;
    s += `<path d="M${ix} ${ey + 4} Q ${x} ${ey - 9} ${ox} ${ey - 6} Q ${x + dd * 4} ${ey + 11} ${ix} ${ey + 4} Z" fill="${iris}" filter="url(#${id}glow)" stroke="${ink}" stroke-width="2.5"/>`;
    s += `<ellipse cx="${x + dd * 1}" cy="${ey + 1}" rx="${sp === "Gorilla" ? 4 : 2.2}" ry="${sp === "Gorilla" ? 4 : 7}" fill="${ink}"/>`;
    // heavy angry brow (disruption makes it heavier)
    const bw = lerp(6, 11, t.hkm) + (sp === "Gorilla" ? 6 : 0);
    s += `<path d="M${ix - dd * 6} ${ey + 2} L${ox + dd * 6} ${ey - 16} L${ox + dd * 4} ${ey - 16 - bw} L${ix - dd * 8} ${ey - 6 - bw * 0.4} Z" fill="${ink}"/>`;
  });
  if (sp === "Gorilla") s += `<path d="M${cx - ex - 24} ${ey - 16} Q ${cx} ${ey - 34} ${cx + ex + 24} ${ey - 16}" fill="none" stroke="${ink}" stroke-width="9" stroke-linecap="round"/>`;
  // nose + snarl wrinkles
  const nY = mY - mH * 0.42;
  if (sp === "Gorilla"){ s += `<ellipse cx="${cx}" cy="${nY + 6}" rx="24" ry="13" fill="${deep}" stroke="${ink}" stroke-width="2.5"/><ellipse cx="${cx - 9}" cy="${nY + 8}" rx="6" ry="4" fill="${ink}"/><ellipse cx="${cx + 9}" cy="${nY + 8}" rx="6" ry="4" fill="${ink}"/>`; }
  else { s += `<path d="M${cx - 13} ${nY} L${cx + 13} ${nY} L${cx} ${nY + 13} Z" fill="${ink}"/>`;
    [-1, 1].forEach(dd => { for (let i = 0; i < 3; i++) s += `<path d="M${cx + dd * (4 + i * 5)} ${nY - 8 - i * 7} q ${dd * 6} -4 ${dd * 12} 0" fill="none" stroke="${ink}" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>`; }); }
  // snarling open mouth
  const oY = mY + mH * 0.28, oW = mW * 0.78, oH = 16 + 14 * t.fang;
  s += `<path d="M${cx - oW} ${oY} Q ${cx} ${oY - 10} ${cx + oW} ${oY} Q ${cx + oW * 0.7} ${oY + oH} ${cx} ${oY + oH + 4} Q ${cx - oW * 0.7} ${oY + oH} ${cx - oW} ${oY} Z" fill="#3b0a0a" stroke="${ink}" stroke-width="3"/>`;
  s += `<path d="M${cx - oW + 4} ${oY + 1} Q ${cx} ${oY - 7} ${cx + oW - 4} ${oY + 1} L ${cx + oW - 8} ${oY + 6} Q ${cx} ${oY - 1} ${cx - oW + 8} ${oY + 6} Z" fill="#b91c1c"/>`;
  const nT = 7; for (let i = 0; i < nT; i++){ const x = cx - oW * 0.8 + i * (oW * 1.6 / (nT - 1)); s += `<path d="M${x - 4} ${oY + 3} L${x} ${oY + 11} L${x + 4} ${oY + 3} Z" fill="#fffaf0" stroke="${ink}" stroke-width="1.2"/>`; }
  for (let i = 0; i < 5; i++){ const x = cx - oW * 0.5 + i * (oW / 4); s += `<path d="M${x - 4} ${oY + oH} L${x} ${oY + oH - 9} L${x + 4} ${oY + oH} Z" fill="#fffaf0" stroke="${ink}" stroke-width="1.2"/>`; }
  // fangs: kill-shot runs; saber-tooths get the giant pair
  const fl = sp === "Saber-tooth" ? 52 + 22 * t.fang : 10 + 22 * Math.pow(t.fang, 1.3), fw = sp === "Saber-tooth" ? 8 : 5;
  [-1, 1].forEach(dd => { const x = cx + dd * oW * 0.62; s += `<path d="M${x - fw} ${oY + 2} Q ${x - dd * 2} ${oY + fl * 0.6} ${x + dd * 2} ${oY + fl} Q ${x + fw * 0.4} ${oY + fl * 0.5} ${x + fw} ${oY + 2} Z" fill="#fffaf0" stroke="${ink}" stroke-width="2"/>`; });
  // flat teeth allowed runs: predators show a chipped tooth instead
  if (t.flat > 0.65) s += `<path d="M${cx - 2} ${oY + 3} l4 0 l-1 6 l-2 -2 Z" fill="${ink}"/>`;
  return `<svg viewBox="0 0 300 330" role="img" aria-label="${t.n} drawn as a ${sp}"><g ${flip ? `transform="translate(300 0) scale(-1 1)"` : ""}>${s}</g></svg>`;
}

function shade(hex, f){ const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = f > 0 ? 255 : 0, k = Math.abs(f); r = Math.round(r + (m - r) * k); g = Math.round(g + (m - g) * k); b = Math.round(b + (m - b) * k);
  return `rgb(${r},${g},${b})`; }
function lum(hex){ const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; }
function creature(t, flip){

    else s += `<circle cx="${x + look}" cy="${ey}" r="5.5" fill="#141210"/>`;
    s += `<circle cx="${x + look + 3}" cy="${ey - 4}" r="2" fill="#fff"/>`;
    // brow (disruption)
    const tilt = lerp(-6, 14, t.hkm);
    s += `<path d="M${x - d * 16} ${ey - er - 6 + tilt} L${x + d * 14} ${ey - er - 6 - tilt * 0.3}" stroke="${dark}" stroke-width="${lerp(3, 6, t.hkm)}" stroke-linecap="round"/>`;
  });

    return `<div class="game"><div class="mu">${title}</div><div class="rec"><span class="h">Group</span><span class="h">W-L-P</span><span class="h">Win %</span>${keys.map(k => { const rs = done.filter(r => key(r) === k); return rs.length ? line(k, rs) : ""; }).join("")}</div></div>`; };
  const sp = done.filter(r => r.market !== "ml"), ml = done.filter(r => r.market === "ml");
  v.innerHTML = `<div class="legend">Against the spread you need about 52.4% to profit at standard -110 prices. Small samples swing a lot, so give each group 30+ picks before trusting it.</div>
    <div class="game"><div class="mu">Overall</div><div class="rec"><span class="h">Bet</span><span class="h">W-L-P</span><span class="h">Win %</span>${sp.length ? line("Spread", sp) : ""}${ml.length ? line("Moneyline", ml) : ""}${line("All picks", done)}</div></div>` +
    group("By confidence", r => `${r.confidence}/5`, ["5/5", "4/5", "3/5", "2/5", "1/5"]) +
    group("By side", r => r.side === "fav" ? "Favorite" : "Underdog", ["Favorite", "Underdog"]) +
    group("By pillar tier", r => r.tier === "" ? "Too early" : `${r.tier}/4${Number(r.dog_edges) ? " with dog edge" : ""}`) +
    group("By stage", r => r.stage === "scored" ? "5+ games" : r.stage === "early" ? "2 to 4 games" : "Too early") +
    group("By flag", r => (String(r.flags).match(/Wounded prey|Favorite wounded|Dog wins the glass|Edge is mostly shooting|System flip|A\/TO under/) || ["No flag"])[0]) +
    `<div class="game"><div class="mu">Latest results</div>${done.slice(-10).reverse().map(r => `<div class="mine" style="margin-top:5px"><span class="st ${r.status}">${r.status}</span> <b>${r.pick}</b> ${r.final ? "· " + r.final : ""} · ${r.confidence}/5</div>`).join("")}</div>`;
}
function card(g){
  const a = analyze(g);
  if(!g.fav){
    const a0 = analyze(g), pv = S && g.day && g.day !== S.date ? `<span class="prev">preview</span>` : "";
    return `<div class="game faded"><div class="duo">${icon(g.away, false)}<div class="mu">${g.away_name}<br><span class="dog">at ${g.home_name}</span>${pv}</div>${icon(g.home, true)}</div><div class="lc">No line posted yet</div>${a0.flags.length ? `<div class="flags">${a0.flags.map(([k, t]) => `<span class="f ${k}">${t}</span>`).join("")}</div>` : ""}${injBlock([g.away, g.home])}</div>`;
  }
  const tier = a.level === "too early" ? `<span class="tier early">too early</span>` :
    `<span class="tier${a.level === "early" ? " early" : ""}">${a.tier}/4${a.preyEdges ? ` · dog ${a.preyEdges}` : ""}${a.level === "early" ? " early" : ""}</span>`;
  const preview = S && g.day && g.day !== S.date ? `<span class="prev">preview</span>` : "";
  return `<div class="game${a.level === "scored" ? "" : " faded"}">
   <div class="top"><div class="duo">${icon(g.fav, false)}<div class="mu"><span class="fav">${nm(g.fav, g)} -${g.line}</span><br><span class="dog">${venue(g)}</span>${preview}</div>${icon(g.dog, true)}</div>${tier}</div>
   <div class="lc">Spread says <b>${pct(g.spread_win)}</b> to win${g.ml_win != null ? ` · book moneyline ${pct(g.ml_win)}` : ""}</div>
   ${a.flags.length ? `<div class="flags">${a.flags.map(([k, t]) => `<span class="f ${k}">${t}</span>`).join("")}</div>` : ""}
   ${injBlock([g.fav, g.dog])}
   ${pickBlock(g)}
   <details><summary>Pillars and exchange check</summary>${a.level === "too early" ? `<div class="lc">Pillars show once both teams have 2 games.</div>` : bars(g)}
    <div class="xp"><label for="x${g.id}">Exchange price for ${nm(g.fav, g)} to win</label><input id="x${g.id}" inputmode="decimal" placeholder="e.g. 90" data-sw="${g.spread_win}"><span id="o${g.id}"></span></div>
   </details></div>`;
}
function sortGames(gs){
  const rank = g => { const a = analyze(g); return [a.level === "scored" ? 0 : a.level === "early" ? 1 : 2, -(a.tier || 0), a.preyEdges || 0, g.line || 99]; };
  return [...gs].sort((x, y) => { const a = rank(x), b = rank(y); for(let i = 0; i < 4; i++) if(a[i] !== b[i]) return a[i] - b[i]; return 0; });
}
function render(){
  const v = $("view");
  if(!S){ v.innerHTML = `<div class="empty">No slate yet.</div>`; return; }
  const games = S.games.filter(g => g.state !== "post" && (!g.day || g.day === S.date));
  const all = S.games.filter(g => g.state !== "post");
  if(view === "up"){
    v.innerHTML = `<input class="search" id="uq" placeholder="Find a team's next game" autocomplete="off"><div id="ul"></div>`;
    const draw = () => { const q = $("uq").value.trim().toLowerCase();
      const days = [...new Set(all.map(g => g.day))].sort();
      $("ul").innerHTML = days.map(d => { let gs = sortGames(all.filter(g => g.day === d));
        if(q) gs = gs.filter(g => (g.home_name + " " + g.away_name).toLowerCase().includes(q));
        if(!gs.length) return "";
        const lab = new Date(d + "T12:00:00").toLocaleDateString(undefined, {weekday: "long", month: "short", day: "numeric"});
        return `<div class="day">${d === S.date ? "Today, " : ""}${lab}</div>` + gs.map(card).join(""); }).join("") || `<div class="empty">No games in the next 3 days${q ? " for that team" : ""}.</div>`; };
    $("uq").insertAdjacentHTML("beforebegin", `<div class="legend">Sorted by pillar dominance (favorite ahead by 0.5+ in each of 4 pillars), then fewest underdog edges, then spread. Faded cards are early: fewer than 5 games for one team.</div>`);
    $("uq").addEventListener("input", draw); draw(); return;
  }
  if(view === "bet"){
    renderBet(v);
  } else if(view === "record"){
    renderRecord(v);
  } else if(view === "line"){
    const gs = all.filter(g => g.fav).sort((a, b) => Math.abs((b.ml_win ?? b.spread_win) - b.spread_win) - Math.abs((a.ml_win ?? a.spread_win) - a.spread_win) || a.line - b.line);
    v.innerHTML = `<div class="legend">What each spread implies about the favorite's chance to win. Type an exchange price to see the gap. A -25 favorite should be about 99%.</div>` +
      gs.map(g => `<div class="game"><div class="top"><div class="mu"><span class="fav">${nm(g.fav, g)} -${g.line}</span> <span class="dog">${venue(g)}</span></div></div>
        <div class="lc">Spread implies <b>${pct(g.spread_win)}</b>${g.ml_win != null ? ` · book moneyline <b>${pct(g.ml_win)}</b>` : ""}</div>
        <div class="xp"><label for="x${g.id}">Exchange price</label><input id="x${g.id}" inputmode="decimal" placeholder="e.g. 90" data-sw="${g.spread_win}"><span id="o${g.id}"></span></div></div>`).join("");
  } else if(view === "teams"){
    v.innerHTML = `<input class="search" id="q" placeholder="Search a team" autocomplete="off"><div id="tl"></div>`;
    const draw = () => { const q = $("q").value.trim().toLowerCase();
      const list = Object.values(TM).filter(t => !q || t.name.toLowerCase().includes(q)).sort((a, b) => b.games - a.games || a.name.localeCompare(b.name)).slice(0, 40);
      $("tl").innerHTML = list.map(t => `<div class="game${t.stage === "scored" ? "" : " faded"}"><div class="top"><div class="duo">${icon(Object.keys(TM).find(k => TM[k] === t), false)}<div class="mu">${t.name}</div></div><span class="tier${t.stage === "scored" ? "" : " early"}">${t.record} · ${t.stage}</span></div>
        <div class="lc">${t.critter ? `${t.critter.sp}, ${t.critter.core}/6 apex traits` : "Blob until 5 games"}${t.fin_n ? ` · finisher ${t.fin_n ? Math.round(t.fin * 100) + "% of " + t.fin_n + " big leads" : ""}` : ""} · last 5: ${t.last5 || "–"} · avg margin ${t.margin} · A/TO ${t.ato} · ORBTV/100 ${t.orbtv}${t.big_win ? " · has a 15+ win" : ""}</div>
        ${t.stage !== "too early" ? PIL.map(p => `<div class="pill" style="grid-template-columns:7.5em 1fr 3em"><span>${p}</span><div class="bar"><em></em>${t.pillars[p] == null ? "" : `<i style="background:var(--fav);left:${t.pillars[p] < 0 ? 50 + Math.max(-2.5, t.pillars[p]) / 5 * 100 : 50}%;width:${Math.min(2.5, Math.abs(t.pillars[p])) / 5 * 100}%"></i>`}</div><span>${t.pillars[p] == null ? "–" : t.pillars[p].toFixed(1)}</span></div>`).join("") : ""}
        ${(t.injuries || []).map(i => `<div class="lc">🩹 ${i.player}${i.ppg != null ? ` (${i.ppg} ppg${i.rank ? `, #${i.rank}` : ""})` : ""}: ${i.status}${i.injury ? ", " + i.injury : ""}${i.fresh && (i.status === "Out" || i.status === "Doubtful") ? ", new absence" : i.long ? ", long-term" : i.missed ? ", already missing games" : ""} · ${i.source === "S" ? "SCACC" : i.source === "B" ? "Boyd's" : "both sources"}</div>`).join("")}</div>`).join(""); };
    $("q").addEventListener("input", draw); draw();
  } else {
    const M = (MV && MV.movers) || [];
    v.innerHTML = `<div class="legend">Teams whose critter changed since about a week ago, whose last 5 games moved a pillar by 0.75+, or who won 4 of their last 5. <b>Real shift</b> = winning with better pillars. <b>Hot streak</b> = winning without them, often shooting.</div>` +
      (M.map(m => `<div class="game"><div class="top"><div class="duo">${icon(m.team, false)}<div class="mu">${m.name}<br><span class="dog">${m.then && m.then !== m.now ? `${m.then} → ${m.now}` : m.now} · last 5: ${m.last5}</span></div></div>${m.label ? `<span class="tier${m.label.startsWith("Real") ? "" : " early"}">${m.label}</span>` : ""}</div>
        ${Object.keys(m.jumps).length ? `<div class="flags">${Object.entries(m.jumps).map(([p, d]) => `<span class="f ${d > 0 ? "bet" : "bad"}">${p} ${d > 0 ? "+" : ""}${d.toFixed(1)}</span>`).join("")}</div>` : ""}</div>`).join("") ||
      `<div class="empty">No movers yet. This fills in once teams reach 5 games and there's a week of daily snapshots to compare against.</div>`);
  }
}
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-pk],[data-save],[data-del],[data-act],[data-goto]"); if(!t) return;
  if(t.dataset.pk){ const gid = t.dataset.pk, s = SEL[gid] = SEL[gid] || {}; s[t.dataset.k] = t.dataset.k === "conf" ? Number(t.dataset.val) : t.dataset.val; redrawPick(gid); }
  else if(t.dataset.save){ savePick(t.dataset.save); }
  else if(t.dataset.del){ removePick(t.dataset.del, t.dataset.gid); }
  else if(t.dataset.goto){ document.querySelector(`[data-v="${t.dataset.goto}"]`).click(); }
  else if(t.dataset.act === "changeurl"){ LOG.url = ""; render(); }
  else if(t.dataset.act === "seturl"){
    const url = $("logurl").value.trim(), msg = $("logmsg");
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ msg.textContent = "That doesn't look like an Apps Script web app link."; return; }
    msg.textContent = "Checking…";
    try{ const r = await (await fetch(url, {method: "POST", body: JSON.stringify({action: "ping"})})).json(); if(!r.ok) throw 0;
      LOG.url = url; try{ localStorage.setItem("critterLogUrl", url); }catch(err){}
      LOG.loaded = false; await loadLog(); render();
    }catch(err){ msg.textContent = "Couldn't reach it. Check that the deployment's access is set to Anyone."; }
  }
});
document.addEventListener("input", e => {
  const el = e.target; if(!el.dataset || !el.dataset.sw) return;
  const out = $("o" + el.id.slice(1)), x = parseFloat(el.value), sw = parseFloat(el.dataset.sw);
  if(!out) return; if(isNaN(x)){ out.textContent = ""; return; }
  const p = x > 1 ? x / 100 : x, gap = sw - p;
  out.innerHTML = `<b style="color:${gap >= 0.03 ? "var(--good)" : gap <= -0.03 ? "var(--bad)" : "var(--muted)"}">${gap >= 0 ? "+" : ""}${Math.round(gap * 100)} pts ${gap >= 0.03 ? "cheap" : gap <= -0.03 ? "pricey" : "fair"}</b>`;
});
document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { view = b.dataset.v; document.querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
(async () => {
  try{
    /* Read data straight from the repo, so a slow GitHub Pages rebuild never leaves the board a day behind */
    const m = location.hostname.match(/^([^.]+)\.github\.io$/), repo = location.pathname.split("/").filter(Boolean)[0];
    const base = m && repo ? `https://raw.githubusercontent.com/${m[1]}/${repo}/main/data/` : "data/";
    const load = f => fetch(base + f + ".json?t=" + Date.now(), {cache: "no-store"}).then(r => r.json());
    let s, t, l;
    try{ [s, t, l] = await Promise.all(["slate", "teams", "latest"].map(load)); }
    catch(e){ [s, t, l] = await Promise.all(["slate", "teams", "latest"].map(f => fetch(`data/${f}.json`, {cache: "no-store"}).then(r => r.json()))); }
    S = s; TM = t.teams || {}; L = l;
    try{ MV = await load("movers"); }catch(e){ MV = null; }
    const n = Object.values(TM).filter(x => x.stage === "scored").length;
    $("sub").textContent = `${S.date} · ${S.games.filter(g => !g.day || g.day === S.date).length} games today · ${n} teams with 5+ games`;
    $("status").innerHTML = "Data: " + Object.entries(L.status || {}).filter(([k]) => k !== "injury_meta").map(([k, v]) => `${k} ${v}`).join(" · ") + `<br>Updated ${new Date(L.updated).toLocaleString()}`;
    const im = (L.status || {}).injury_meta;
    if(im && (im.boyds_age_days == null || im.boyds_age_days > 3)) $("sub").insertAdjacentHTML("afterend", `<div class="banner">Boyd's injury list was last updated ${im.boyds_updated || "a while ago"}. SCACC is the live source for injuries right now.</div>`);
  }catch(e){ $("sub").textContent = "Couldn't load data. Run the workflow once from the Actions tab."; }
  render();
  await loadLog(); render();
})();
</script>
